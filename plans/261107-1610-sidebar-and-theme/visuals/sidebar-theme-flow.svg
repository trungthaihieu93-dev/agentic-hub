/* ak-diagram core SVG styles: shared by the reader fragment and standalone SVG.
   Colour comes from --ak-* palette variables and --ak-role-* family tokens. */

.ak-diagram-svg { font-family: var(--ak-font-sans); display: block; }
.ak-diagram-svg text { user-select: none; }

.ak-canvas { fill: var(--ak-bg); }
.ak-grid-dot { fill: var(--ak-text-muted); opacity: 0.28; }

.ak-title { font-size: 16px; font-weight: 700; fill: var(--ak-text-primary); letter-spacing: -0.01em; }
.ak-subtitle { font-size: 11px; font-weight: 500; fill: var(--ak-text-secondary); }

/* Frames: boundaries, lanes, stages */
.ak-frame { fill: var(--ak-surface); stroke: var(--ak-surface-border); stroke-width: 1; }
.ak-frame-boundary { fill: transparent; stroke-dasharray: 6 4; stroke-width: 1.5; }
.ak-frame-stage { stroke-dasharray: 4 3; }
.ak-frame-label { font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; fill: var(--ak-text-secondary); }
.ak-frame-role { font-size: 10px; fill: var(--ak-text-muted); }

/* Nodes */
.ak-node { cursor: pointer; }
.ak-node-mask { fill: var(--ak-node-bg); }
.ak-node-card { fill: var(--ak-node-fill, var(--ak-node-bg)); stroke: var(--ak-node-stroke, var(--ak-node-border)); stroke-width: 1.5; transition: stroke-width 160ms ease; }
.ak-node[data-shape="notch"] .ak-node-card { stroke-width: 2; }
.ak-node-accent { fill: var(--ak-node-stroke, var(--ak-accent)); }
.ak-sigil path { fill: none; stroke: var(--ak-node-stroke, var(--ak-accent)); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.ak-node-label { font-size: 13px; font-weight: 600; fill: var(--ak-text-primary); }
.ak-node-sub { font-size: 9.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; fill: var(--ak-text-muted); }
.ak-node:hover .ak-node-card, .ak-node:focus-visible .ak-node-card { stroke-width: 2.5; }
.ak-node:focus-visible { outline: none; }

/* Edges */
.ak-edge-path { fill: none; stroke: var(--ak-edge-stroke); stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; transition: stroke 160ms ease, stroke-width 160ms ease; }
.ak-edge-dashed { stroke-dasharray: 5 4; }
.ak-edge[data-tone="failure"] .ak-edge-path { stroke: var(--ak-role-failure-stroke); }
.ak-edge[data-tone="decision"] .ak-edge-path { stroke: var(--ak-role-decision-stroke); }
.ak-edge-flow { fill: none; stroke: var(--ak-edge-active); stroke-width: 2.25; stroke-linecap: round; opacity: 0; pointer-events: none; }
.ak-edge-label-mask { fill: var(--ak-bg); stroke: var(--ak-surface-border); stroke-width: 1; }
.ak-edge-label text { font-size: 10.5px; font-weight: 500; fill: var(--ak-text-secondary); }
.ak-arrowhead { fill: var(--ak-edge-stroke); }
.ak-arrowhead-open { fill: none; stroke: var(--ak-edge-stroke); stroke-width: 1.25; }

/* Sequence extras */
.ak-lifeline { stroke: var(--ak-edge-stroke); stroke-width: 1.25; stroke-dasharray: 4 4; opacity: 0.55; }
.ak-activation { fill: var(--ak-accent-light); stroke: var(--ak-accent); stroke-width: 1; }

/* Legend */
.ak-legend-swatch { stroke-width: 1.5; }
.ak-legend-item text { font-size: 10.5px; font-weight: 500; fill: var(--ak-text-secondary); }

/* Motion: staggered entrance, edge draw, optional finite trace pass.
   Total budget stays under 8 s because --step is capped at 40 by the compiler. */
@media (prefers-reduced-motion: no-preference) {
  [data-motion="play"] [data-animate="node"] {
    transform-box: fill-box;
    transform-origin: center;
    animation: ak-node-in 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    animation-delay: calc(var(--step, 0) * 110ms);
  }
  [data-motion="play"] [data-animate="edge"] .ak-edge-path {
    stroke-dasharray: 100;
    stroke-dashoffset: 100;
    animation: ak-edge-draw 0.7s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    animation-delay: calc(var(--step, 0) * 110ms + 140ms);
  }
  [data-motion="play"] [data-animate="edge"] .ak-edge-dashed {
    animation-name: ak-edge-draw-dashed;
  }
  [data-motion="play"] [data-animate="edge"] .ak-edge-label {
    opacity: 0;
    animation: ak-fade-in 0.4s ease forwards;
    animation-delay: calc(var(--step, 0) * 110ms + 520ms);
  }
  [data-motion="play"] [data-animate="frame"] {
    opacity: 0;
    animation: ak-fade-in 0.5s ease forwards;
  }
  [data-motion="play"][data-animation="trace"] [data-animate="edge"] .ak-edge-flow,
  [data-motion="play"] [data-animation="trace"] [data-animate="edge"] .ak-edge-flow {
    stroke-dasharray: 5 9;
    animation: ak-edge-flow 1.3s linear 3;
    animation-delay: calc(var(--step, 0) * 110ms + 900ms);
  }
  [data-motion="play"][data-animation="trace"] [data-animate="node"] .ak-node-card,
  [data-motion="play"] [data-animation="trace"] [data-animate="node"] .ak-node-card {
    animation: ak-node-pulse 1.6s ease-in-out 1;
    animation-delay: calc(var(--step, 0) * 110ms + 900ms);
  }
}
@media (prefers-reduced-motion: reduce) {
  .ak-diagram-svg *, .ak-diagram-svg { animation: none !important; transition: none !important; }
}

@keyframes ak-node-in {
  from { opacity: 0; transform: translateY(10px) scale(0.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes ak-edge-draw {
  to { stroke-dashoffset: 0; }
}
@keyframes ak-edge-draw-dashed {
  to { stroke-dashoffset: 0; stroke-dasharray: 5 4; }
}
@keyframes ak-fade-in {
  to { opacity: 1; }
}
@keyframes ak-edge-flow {
  0% { stroke-dashoffset: 28; opacity: 0; }
  15% { opacity: 0.9; }
  85% { opacity: 0.9; }
  100% { stroke-dashoffset: 0; opacity: 0; }
}
@keyframes ak-node-pulse {
  0%, 100% { stroke-width: 1.5; }
  50% { stroke-width: 3; }
}
