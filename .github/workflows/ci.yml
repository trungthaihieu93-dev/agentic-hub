name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.4

      # node:sqlite and the ah runtime need Node 26 (package.json engines).
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26

      - run: bun install --frozen-lockfile

      - name: Lint, test, build and typecheck
        run: bunx nx run-many -t lint test build typecheck --output-style=static

      - name: Validate OpenSpec specs
        run: bun run spec:validate

      - name: Build documentation
        run: bun run docs:build

      - name: Upload documentation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: apps/docs/dist
          if-no-files-found: error

  deploy-docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: docs-production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: documentation
          path: docs-output

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26

      - name: Check current production revision
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          current=$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)
          if [ "$current" = "$REVISION" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Skipping an outdated production deployment.'
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.revision.outputs.current == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          test -n "$PAGES_PROJECT" || { echo 'Set the CLOUDFLARE_PAGES_PROJECT_NAME repository variable.'; exit 1; }
          bunx wrangler@4.160.0 pages deploy docs-output --project-name "$PAGES_PROJECT" --branch main
